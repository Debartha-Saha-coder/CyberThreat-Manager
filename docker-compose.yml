version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./hackmetrix.db
      - SECRET_KEY=${SECRET_KEY:-changeme-docker-default}
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - GOOGLE_SAFE_BROWSING_API_KEY=${GOOGLE_SAFE_BROWSING_API_KEY:-}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - PHISHTANK_API_KEY=${PHISHTANK_API_KEY:-}
    volumes:
      - ./backend:/app
      - hackmetrix_db:/app/data
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  hackmetrix_db:
